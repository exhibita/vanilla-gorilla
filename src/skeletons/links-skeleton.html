<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="./css/style.min.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <meta name="description" content="A list of links.">
    <!-- Local CSS overrides from the "css:" front matter are injected here by build.js -->
</head>
<body class="links-page">
    <main class="links-container">
        <!-- build.js sets the image from the "image:" front matter and removes this tag when there is none -->
        <img class="links-image" id="links-image" src="" alt="">
        <h1 class="entry-title"><!-- Page title injected here --></h1>
        <div class="entry-content">
            <!-- Markdown body injected here -->
        </div>
        <nav class="links-list" id="links" aria-label="Links">
            <!-- Link buttons are generated by build.js from the "links:" front matter list -->
        </nav>
    </main>
</body>
</html>
